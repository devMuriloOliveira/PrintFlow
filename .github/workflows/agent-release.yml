name: Agent Release

env:
  FILA_AGENT_NODE_VERSION: '24.19.0'
  FILA_AGENT_MINIMUM_SUPPORTED_VERSION: '0.1.10'
  FILA_AGENT_RELEASE_TAG: ${{ inputs.agent_tag || github.ref_name }}

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      agent_tag:
        description: Tag existente do Agent para validar ou publicar
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: startsWith(inputs.agent_tag || github.ref_name, 'agent-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FILA_AGENT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: Agent/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and package
        shell: cmd
        run: dotnet run --project Agent\windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- validate-release --tag %FILA_AGENT_RELEASE_TAG% --minimum-supported-version %FILA_AGENT_MINIMUM_SUPPORTED_VERSION%

      - name: Install production dependencies
        working-directory: Agent
        shell: cmd
        run: npm ci --omit=dev

      - name: Test Agent
        working-directory: Agent
        shell: cmd
        run: npm test

      - name: Build package and prepare Early Access release
        working-directory: Agent
        shell: cmd
        env:
          FILA_AGENT_API_URL: ${{ vars.FILA_AGENT_API_URL || vars.PRINTFLOW_API_URL || 'https://printflow-api-4y5l.onrender.com' }}
          FILA_AGENT_DEV_CERT_PFX_BASE64: ${{ secrets.FILA_AGENT_DEV_CERT_PFX_BASE64 || secrets.PRINTFLOW_AGENT_DEV_CERT_PFX_BASE64 }}
          FILA_AGENT_DEV_CERT_PASSWORD: ${{ secrets.FILA_AGENT_DEV_CERT_PASSWORD || secrets.PRINTFLOW_AGENT_DEV_CERT_PASSWORD }}
        run: |
          dotnet run --project windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- package --api-url "%FILA_AGENT_API_URL%" --output-dir dist --sign-dev --require-persisted-certificate || exit /b 1
          dotnet run --project windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- export-dev-certificate --output dist\Fila-Agent-Dev-Certificate.cer || exit /b 1
          if not exist dist\Fila-Agent-Dev-Certificate.cer (
            echo Certificado publico ausente imediatamente apos o empacotamento assinado.
            exit /b 1
          )
          dir /b dist || exit /b 1
          dotnet run --project windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- prepare-release --tag %FILA_AGENT_RELEASE_TAG% --minimum-supported-version %FILA_AGENT_MINIMUM_SUPPORTED_VERSION%

      - name: Publish Early Access release
        working-directory: Agent
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- publish-release --tag %FILA_AGENT_RELEASE_TAG% --repository %GITHUB_REPOSITORY%
