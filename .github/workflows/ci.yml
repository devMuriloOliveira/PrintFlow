name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: docker://zricethezav/gitleaks:v8.24.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source=/github/workspace --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-production-config.mjs
        env:
          PRINTFLOW_API_URL: https://api.example.invalid
          NUXT_PUBLIC_API_BASE: https://app.example.invalid
          PRINTFLOW_WS_URL: wss://api.example.invalid
          PRINTFLOW_DEV_MOCK_BAMBU: 'false'
          OBJECT_STORAGE_PROVIDER: r2
          R2_ACCOUNT_ID: account-example
          R2_BUCKET: printflow3d-storage
          R2_ENDPOINT: https://account-example.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: access-example
          R2_SECRET_ACCESS_KEY: secret-example

  verify:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            path: BackEnd
            command: npm test
          - name: agent
            path: Agent
            command: node ../scripts/check-agent-release-contract.mjs && node ../scripts/validate-agent-package.mjs && npm test
          - name: frontend
            path: FrontEnd
            command: npm run build
          - name: admin-frontend
            path: AdminFrontEnd
            command: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - uses: actions/setup-dotnet@v4
        if: matrix.name == 'agent'
        with:
          dotnet-version: 8.0.x
      - run: npm ci
        working-directory: ${{ matrix.path }}
      - name: Build Agent release tool
        if: matrix.name == 'agent'
        run: dotnet build windows-release-tool/FilaAgent.ReleaseTool.csproj --configuration Release
        working-directory: Agent
      - run: ${{ matrix.command }}
        working-directory: ${{ matrix.path }}

  backup-restore-integration:
    needs: security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/package-lock.json
      - run: sudo apt-get update
      - run: sudo apt-get install --yes postgresql-client
      - run: npm ci
        working-directory: BackEnd
      - run: npm run test:backup-restore
        working-directory: BackEnd
        env:
          PRINTFLOW_RESTORE_TEST_DATABASE_URL: postgresql://postgres:restore-test-only@127.0.0.1:5432/postgres?sslmode=disable
          PRINTFLOW_RESTORE_TEST_CONFIRM: isolated-only

  agent-production-package:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore C# Agent projects
        shell: cmd
        run: |
          dotnet restore Agent\windows-host\FilaAgent.csproj --runtime win-x64
          if errorlevel 1 exit /b %errorlevel%
          dotnet restore Agent\windows-setup\FilaAgentSetup.csproj --runtime win-x64
          if errorlevel 1 exit /b %errorlevel%
          dotnet restore Agent\windows-runtime-live-smoke\FilaAgent.OrcaStore.LiveSmoke.csproj
          if errorlevel 1 exit /b %errorlevel%
          dotnet restore Agent\windows-release-tool\FilaAgent.ReleaseTool.csproj
          if errorlevel 1 exit /b %errorlevel%
          dotnet restore Agent\windows-runtime-tests\FilaAgent.Runtime.ContractTests.csproj
          if errorlevel 1 exit /b %errorlevel%
      - name: Exercise C# runtime contracts on Windows
        shell: cmd
        run: dotnet run --project Agent\windows-runtime-tests\FilaAgent.Runtime.ContractTests.csproj --configuration Release
      - name: Build Production package without publishing
        shell: cmd
        env:
          FILA_AGENT_API_URL: https://api.example.invalid
        run: dotnet run --project Agent\windows-release-tool\FilaAgent.ReleaseTool.csproj --configuration Release -- package --api-url %FILA_AGENT_API_URL% --no-restore
      - name: Validate package contract and generated artifact
        shell: cmd
        run: >-
          node scripts/validate-agent-package.mjs
          && Agent\dist\Fila-Agent-Setup.exe --validate-embedded-package
