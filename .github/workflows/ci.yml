name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            path: BackEnd
            command: npm test
          - name: agent
            path: Agent
            command: npm test
          - name: frontend
            path: FrontEnd
            command: npm run build
          - name: admin-frontend
            path: AdminFrontEnd
            command: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.path }}
      - run: ${{ matrix.command }}
        working-directory: ${{ matrix.path }}
